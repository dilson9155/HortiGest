<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f766e" />
    <title>HortiGest — Sem conexão</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f8fafc;
        color: #0f172a;
        font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
        padding: 24px;
      }
      .card {
        width: min(420px, 100%);
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 20px;
        box-shadow: 0 16px 40px rgba(15, 23, 42, 0.08);
        padding: 32px;
        text-align: center;
      }
      img { width: 84px; height: 84px; object-fit: contain; margin-bottom: 12px; }
      h1 { font-size: 1.35rem; margin: 0 0 8px; color: #0f766e; }
      p { font-size: 0.95rem; line-height: 1.5; color: #475569; margin: 0 0 24px; }
      button {
        width: 100%;
        border: 0;
        border-radius: 12px;
        padding: 13px 18px;
        background: #0f766e;
        color: #fff;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
      }
      button:hover { background: #0d9488; }
      small { display: block; margin-top: 14px; color: #94a3b8; }
    </style>
  </head>
  <body>
    <main class="card">
      <img src="/logo.png" alt="HortiGest" />
      <h1>Você está sem conexão</h1>
      <p>
        Não foi possível acessar o HortiGest agora. Verifique sua internet e tente novamente.
        Seus dados já salvos permanecem no servidor.
      </p>
      <button type="button" onclick="location.reload()">Tentar novamente</button>
      <small>HortiGest · PWA</small>
    </main>
  </body>
</html>
